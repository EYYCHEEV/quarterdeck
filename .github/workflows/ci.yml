name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect the web app
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
    outputs:
      web: ${{ steps.web.outputs.web }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Look for the web app
        id: web
        run: |
          if [ -f apps/web/package.json ]; then
            echo "web=true" >> "$GITHUB_OUTPUT"
          else
            echo "web=false" >> "$GITHUB_OUTPUT"
          fi

  python:
    name: Python tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: CI tool tests
        run: python3 -m unittest discover -s tools/ci -p 'test_*.py'

      - name: Sign-up module tests
        run: python3 -m unittest discover -s signup -p 'test_*.py'

      - name: Mail client tests
        run: python3 -m unittest discover -s mail -p 'test_*.py'

      - name: Connect client and MCP tests
        env:
          PYTHONPATH: signup:mail
        run: python3 -m unittest discover -s golive/connect -p 'test_*.py'

      - name: Wheel build tests
        run: python3 -m unittest discover -s qd-client-wheel -p 'test_*.py'

  server:
    name: Server tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    container:
      image: docker.io/library/python@sha256:0aecac02dc3d4c5dbb024b753af084cafe41f5416e02193f1ce345d671ec966e
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Fetch the pinned Node
        run: python3 tools/ci/fetch-pinned node

      - name: Put the pinned Node first on the path
        run: echo "$RUNNER_TEMP/pinned/node-v22.21.0-linux-x64/bin" >> "$GITHUB_PATH"

      - name: Server suites, one process each
        run: python3 deploy/server_lane.py

  extension:
    name: Wake extension tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Run the extension tests
        working-directory: omp-quarterdeck
        run: bun test

  no-comments:
    name: No comments in code
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Fail on any comment or docstring
        run: python3 tools/ci/no-comments

      - name: Fail on a symlink, a special file or an unlisted binary
        run: python3 tools/ci/file-kinds

  leaks:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      EVENT: ${{ github.event_name }}
      BASE: ${{ github.event.pull_request.base.sha }}
      HEAD: ${{ github.event.pull_request.head.sha }}
      BEFORE: ${{ github.event.before }}
      AFTER: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch the pinned gitleaks
        run: python3 tools/ci/fetch-pinned gitleaks

      - name: Scan the checkout and the new commits
        run: |
          if [ -e .gitleaksignore ] || [ -L .gitleaksignore ]; then
            echo "::error file=.gitleaksignore::gitleaks always reads this file, so this repository keeps none. Remove it."
            exit 1
          fi
          gitleaks="$RUNNER_TEMP/pinned/gitleaks/gitleaks"
          "$gitleaks" dir --redact --no-banner --config tools/ci/gitleaks.toml --ignore-gitleaks-allow --gitleaks-ignore-path "$RUNNER_TEMP/no-gitleaksignore" --report-format json --report-path "$RUNNER_TEMP/leaks-dir.json" --exit-code 0 .
          if [ "$EVENT" = "pull_request" ]; then
            range="$BASE..$HEAD"
          elif [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            range="$AFTER"
          else
            range="$BEFORE..$AFTER"
          fi
          "$gitleaks" git --redact --no-banner --config tools/ci/gitleaks.toml --ignore-gitleaks-allow --gitleaks-ignore-path "$RUNNER_TEMP/no-gitleaksignore" --report-format json --report-path "$RUNNER_TEMP/leaks-git.json" --exit-code 0 --log-opts="$range" .

      - name: Report the rule and the path only
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import sys

          rows = []
          for name in ("leaks-dir.json", "leaks-git.json"):
              report = pathlib.Path(os.environ["RUNNER_TEMP"]) / name
              for item in json.loads(report.read_text(encoding="utf-8")) or []:
                  rows.append((name, item.get("RuleID", "unknown"), item.get("File", "unknown")))
          for name, rule, path in sorted(rows):
              print(f"{name} {rule} {path}")
          print(f"leaks: {len(rows)} finding(s)")
          sys.exit(1 if rows else 0)
          PY

  web-static:
    name: Web static checks
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Fetch the pinned Node
        run: python3 tools/ci/fetch-pinned node

      - name: Put the pinned Node first on the path
        run: echo "$RUNNER_TEMP/pinned/node-v22.21.0-linux-x64/bin" >> "$GITHUB_PATH"

      - name: Install from the lock file
        working-directory: apps/web
        run: npm ci --ignore-scripts

      - name: Verify registry signatures
        working-directory: apps/web
        run: npm audit signatures

      - name: Lint
        working-directory: apps/web
        run: npm run lint

      - name: Typecheck
        working-directory: apps/web
        run: npm run typecheck

      - name: Data tests
        working-directory: apps/web
        run: npm run test:data

      - name: Task card tests
        working-directory: apps/web
        run: npm run test:taskcard

  web-build:
    name: Web build
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Fetch the pinned Node
        run: python3 tools/ci/fetch-pinned node

      - name: Put the pinned Node first on the path
        run: echo "$RUNNER_TEMP/pinned/node-v22.21.0-linux-x64/bin" >> "$GITHUB_PATH"

      - name: Install from the lock file
        working-directory: apps/web
        run: npm ci --ignore-scripts

      - name: Build the server bundle and print its hash
        working-directory: apps/web
        run: |
          npm run build:app -- --server
          out="$RUNNER_TEMP/web-bundle"
          mkdir -p "$out"
          tar --sort=name --mtime='1970-01-01 00:00:00 UTC' --owner=0 --group=0 --numeric-owner --mode='u=rwX,go=rX' -cf "$out/server.tar" -C dist .
          sum=$(sha256sum "$out/server.tar" | cut -d' ' -f1)
          printf 'web bundle built with --server for %s: sha256 %s\n' "$GITHUB_SHA" "$sum" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Build the server bundle with chat on and print its hash
        working-directory: apps/web
        run: |
          npm run build:app -- --server --chat
          out="$RUNNER_TEMP/web-bundle"
          mkdir -p "$out"
          tar --sort=name --mtime='1970-01-01 00:00:00 UTC' --owner=0 --group=0 --numeric-owner --mode='u=rwX,go=rX' -cf "$out/server-chat.tar" -C dist .
          sum=$(sha256sum "$out/server-chat.tar" | cut -d' ' -f1)
          printf 'web bundle built with --server --chat for %s: sha256 %s\n' "$GITHUB_SHA" "$sum" | tee -a "$GITHUB_STEP_SUMMARY"

  web-browser:
    name: Web browser checks
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      QD_APP_WORKERS: "4"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Fetch the pinned Node and browser
        run: python3 tools/ci/fetch-pinned node chrome-headless-shell

      - name: Point QD_CHROME at the pinned browser
        run: echo "QD_CHROME=$RUNNER_TEMP/pinned/chrome-headless-shell-linux64/chrome-headless-shell" >> "$GITHUB_ENV"

      - name: Put the pinned Node first on the path
        run: echo "$RUNNER_TEMP/pinned/node-v22.21.0-linux-x64/bin" >> "$GITHUB_PATH"

      - name: Install from the lock file
        working-directory: apps/web
        run: npm ci --ignore-scripts

      - name: App tests
        working-directory: apps/web
        run: npm run test:app

      - name: Chat tests
        working-directory: apps/web
        run: npm run test:chat

  web-design:
    name: Web design check ${{ matrix.size }}
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        size:
          - phone-390
          - ipad-744x1133
          - ipad-1133x744
          - mac-1512
    env:
      DESIGN_SIZE: ${{ matrix.size }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Fetch main for the design comparison
        run: git -c credential.helper= fetch --no-tags --depth=1 origin main:refs/remotes/origin/main

      - name: Fetch the pinned Node and browser
        run: python3 tools/ci/fetch-pinned node chrome-headless-shell

      - name: Point QD_CHROME at the pinned browser
        run: echo "QD_CHROME=$RUNNER_TEMP/pinned/chrome-headless-shell-linux64/chrome-headless-shell" >> "$GITHUB_ENV"

      - name: Put the pinned Node first on the path
        run: echo "$RUNNER_TEMP/pinned/node-v22.21.0-linux-x64/bin" >> "$GITHUB_PATH"

      - name: Install from the lock file
        working-directory: apps/web
        run: npm ci --ignore-scripts

      - name: Design check at one size
        working-directory: apps/web
        run: node tools/design-check.mjs --sizes="$DESIGN_SIZE"

      - name: Refuse any failure file that is not a picture
        id: refuse
        if: failure()
        run: |
          failed=apps/web/design-check/failed
          if [ -L "$failed" ]; then
            exit 1
          fi
          if [ ! -e "$failed" ]; then
            exit 0
          fi
          [ -d "$failed" ] || exit 1
          invalid=$(find "$failed" ! -type d \( ! -type f -o ! -name '*.png' \) -print -quit) || exit 1
          [ -z "$invalid" ] || exit 1
          find "$failed" -type f -exec sh -c '
            for picture do
              signature=$(od -An -tx1 -N8 "$picture") || exit 1
              [ "$signature" = " 89 50 4e 47 0d 0a 1a 0a" ] || exit 1
            done
          ' sh {} +

      - name: Keep the failure pictures for 7 days
        if: failure() && steps.refuse.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: web-design-check-failed-${{ matrix.size }}
          path: apps/web/design-check/failed/**/*.png
          retention-days: 7
          if-no-files-found: ignore

  web-design-selftest:
    name: Web design check self-test
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Fetch the pinned Node and browser
        run: python3 tools/ci/fetch-pinned node chrome-headless-shell

      - name: Point QD_CHROME at the pinned browser
        run: echo "QD_CHROME=$RUNNER_TEMP/pinned/chrome-headless-shell-linux64/chrome-headless-shell" >> "$GITHUB_ENV"

      - name: Put the pinned Node first on the path
        run: echo "$RUNNER_TEMP/pinned/node-v22.21.0-linux-x64/bin" >> "$GITHUB_PATH"

      - name: Install from the lock file
        working-directory: apps/web
        run: npm ci --ignore-scripts

      - name: Design check must fail on a planted spill
        working-directory: apps/web
        run: |
          code=0
          node tools/design-check.mjs --mutant --sizes=phone-390 > "$RUNNER_TEMP/planted.log" 2>&1 || code=$?
          if [ "$code" -ne 1 ] || ! grep -q '^design-check: FAIL' "$RUNNER_TEMP/planted.log"; then
            echo "the design check did not fail on a planted spill; exit code $code"
            exit 1
          fi

  ios-typing-26:
    name: iOS typing lane on iOS 26
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: macos-26
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      IOS_RUNTIME: "26"
      IOS_MODEL: iPhone 17
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Fetch the pinned Node
        run: python3 tools/ci/fetch-pinned node-darwin-arm64

      - name: Put the pinned Node first on the path
        run: echo "$RUNNER_TEMP/pinned/node-v22.21.0-darwin-arm64/bin" >> "$GITHUB_PATH"

      - name: Install from the lock file
        working-directory: apps/web
        run: npm ci --ignore-scripts

      - name: Record the versions
        run: |
          {
            echo "- macOS $(sw_vers -productVersion), build $(sw_vers -buildVersion)"
            echo "- $(xcodebuild -version | tr '\n' ' ')"
            echo "- safaridriver $(safaridriver --version 2>&1 | head -n 1)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Choose the simulator
        run: |
          xcrun simctl list -j devices available > "$RUNNER_TEMP/simulators.json"
          python3 tools/ci/ios_simulator.py pick "$IOS_RUNTIME" "$IOS_MODEL" < "$RUNNER_TEMP/simulators.json" > "$RUNNER_TEMP/simulator.env"
          cat "$RUNNER_TEMP/simulator.env" >> "$GITHUB_ENV"
          sed 's/^/- /' "$RUNNER_TEMP/simulator.env" >> "$GITHUB_STEP_SUMMARY"
          echo "- model: $IOS_MODEL" >> "$GITHUB_STEP_SUMMARY"

      - name: Turn on Remote Automation and boot the simulator
        run: |
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool NO
          if xcrun simctl spawn "$QD_UDID" defaults write com.apple.WebInspector RemoteAutomationEnabled -bool YES > /dev/null 2>&1; then
            echo "- Remote Automation preference written before the first boot" >> "$GITHUB_STEP_SUMMARY"
          else
            xcrun simctl boot "$QD_UDID"
            xcrun simctl bootstatus "$QD_UDID" -b
            xcrun simctl spawn "$QD_UDID" defaults write com.apple.WebInspector RemoteAutomationEnabled -bool YES || { echo "iOS typing lane: Remote Automation is not on in the simulator, the preference could not be written"; exit 1; }
            xcrun simctl shutdown "$QD_UDID"
            echo "- Remote Automation preference written after a first boot, because simctl spawn needs a booted device" >> "$GITHUB_STEP_SUMMARY"
          fi
          xcrun simctl boot "$QD_UDID"
          xcrun simctl bootstatus "$QD_UDID" -b

      - name: Start safaridriver
        run: |
          sudo safaridriver --enable
          driver_port=$(python3 tools/ci/ios_simulator.py port)
          safaridriver --port "$driver_port" > "$RUNNER_TEMP/safaridriver.log" 2>&1 &
          python3 tools/ci/ios_simulator.py wait safaridriver "http://127.0.0.1:$driver_port/status" 60
          echo "QD_WEBDRIVER=http://127.0.0.1:$driver_port" >> "$GITHUB_ENV"

      - name: Check that safaridriver can open a session on the simulator
        run: python3 tools/ci/ios_simulator.py session "$QD_WEBDRIVER" "$QD_UDID"

      - name: Build and serve the app on a loopback port
        working-directory: apps/web
        run: |
          node tools/build-app.mjs --fixtures
          app_port=$(python3 ../../tools/ci/ios_simulator.py port)
          PORT="$app_port" node tools/serve-app.mjs > "$RUNNER_TEMP/app-server.log" 2>&1 &
          python3 ../../tools/ci/ios_simulator.py wait "the app server" "http://127.0.0.1:$app_port/" 60
          echo "QD_ORIGIN=http://127.0.0.1:$app_port" >> "$GITHUB_ENV"

      - name: Typing test on the real app
        run: node apps/web/src/screens/chat/chat_typing_ios.mjs

      - name: Build and serve a copy with the old typing code planted
        run: |
          planted="$RUNNER_TEMP/planted"
          mkdir "$planted"
          git archive HEAD:apps/web | tar -x -f - -C "$planted"
          ln -s "$GITHUB_WORKSPACE/apps/web/node_modules" "$planted/node_modules"
          cd "$planted"
          git apply --check src/screens/chat/pre-367.patch
          git apply src/screens/chat/pre-367.patch
          node tools/build-app.mjs --fixtures
          planted_port=$(python3 "$GITHUB_WORKSPACE/tools/ci/ios_simulator.py" port)
          PORT="$planted_port" node tools/serve-app.mjs > "$RUNNER_TEMP/planted-server.log" 2>&1 &
          python3 "$GITHUB_WORKSPACE/tools/ci/ios_simulator.py" wait "the planted app server" "http://127.0.0.1:$planted_port/" 60
          echo "QD_PLANTED_ORIGIN=http://127.0.0.1:$planted_port" >> "$GITHUB_ENV"

      - name: Typing test on the planted copy must fail on the shrink rule
        env:
          QD_EXPECT: shrink
        run: QD_ORIGIN="$QD_PLANTED_ORIGIN" node apps/web/src/screens/chat/chat_typing_ios.mjs

  ios-typing-27:
    name: iOS typing lane on iOS 27
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: xcode-27
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      IOS_RUNTIME: "27.0"
      IOS_MODEL: iPhone 17
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
